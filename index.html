<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11141b">
<title>禁煙外来 動機づけ面接シミュレーター</title>
<link rel="icon" href="img/favicon.png">
<meta name="description" content="返答を選ぶと、患者さんが声で答える。禁煙外来の動機づけ面接（MI）を練習する教育用デモ。">
<meta property="og:title" content="禁煙外来 動機づけ面接シミュレーター"><meta property="og:description" content="返答を選ぶと、患者さんが声で答える教育用デモ"><meta property="og:image" content="https://shoei05.github.io/kinen-mi-simulator/img/og.jpg"><meta property="og:url" content="https://shoei05.github.io/kinen-mi-simulator/"><meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#14171f;--panel:#1c2030;--line:#2a3045;--text:#e7e9ef;--sub:#9aa3b8;--acc:#f0b429;--good:#3fbf7f;--bad:#e5534b;--blue:#4c8dff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP","Hiragino Sans",sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:#11141b}
.logo{width:34px;height:34px;border-radius:8px;background:var(--acc);color:#111;display:grid;place-items:center;font-weight:900}
header h1{font-size:16px;margin:0;letter-spacing:.05em}header .sub{color:var(--sub);font-size:12px}
main{flex:1;display:grid;grid-template-columns:260px 1fr 300px;min-height:0}
aside{border-right:1px solid var(--line);padding:14px;background:var(--panel)}
.who{display:flex;gap:10px;align-items:center;margin-bottom:12px}.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#2f3650}
.bigav{width:100%;border-radius:14px;margin:6px 0 12px;transition:opacity .3s}
.row{display:flex;gap:8px;align-items:flex-start}.row.d{justify-content:flex-end}.mini{width:34px;height:34px;border-radius:50%;flex:none}
.card{max-height:92vh;overflow-y:auto}.card img.hero{width:100%;height:220px;object-fit:cover;object-position:center 40%;border-radius:12px;margin-bottom:12px}.rep img.hero{height:180px}
.who b{display:block}.who small{color:var(--sub)}
.profile{font-size:13px;color:var(--sub);line-height:1.7}
#chat{display:flex;flex-direction:column;min-height:0}
#log{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:72%;padding:10px 14px;border-radius:14px;line-height:1.7;font-size:15px;position:relative;animation:pop .25s ease}
.msg.p{align-self:flex-start;background:#262c40;border-top-left-radius:4px}
.msg.d{align-self:flex-end;background:#2b4a8b;border-top-right-radius:4px}
.msg .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;margin-left:8px;background:#0b0d12;color:var(--acc);vertical-align:middle}
.tip{align-self:center;max-width:80%;font-size:13px;color:#cfd6e6;background:#1a1f2c;border:1px dashed #3a4462;padding:8px 12px;border-radius:10px}
.tip.good{border-color:var(--good)}.tip.bad{border-color:var(--bad)}
.speaking{align-self:flex-start;color:var(--sub);font-size:13px;display:flex;gap:8px;align-items:center}
.wave{display:flex;gap:3px;align-items:end;height:16px}.wave i{width:3px;background:var(--acc);animation:w 0.9s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes w{0%,100%{height:4px}50%{height:16px}}@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
#choices{border-top:1px solid var(--line);padding:12px 18px;display:grid;gap:8px;background:#161a24;min-height:150px}
#choices .hint{color:var(--sub);font-size:12px}
#choices button{text-align:left;background:#20263a;color:var(--text);border:1px solid #33405f;border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer;font-family:inherit}
#choices button:hover,#choices button.hl{border-color:var(--acc);background:#2a3150}
.side{padding:16px;background:var(--panel);border-left:1px solid var(--line)}
.meter{margin-bottom:16px}.meter .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar{height:10px;border-radius:5px;background:#0d1017;overflow:hidden}.bar i{display:block;height:100%;transition:width .6s ease}
#m-change i{background:var(--good)}#m-rapport i{background:var(--blue)}#m-resistance i{background:var(--bad)}
.counts{font-size:13px;color:var(--sub);line-height:1.9}.counts b{color:var(--text)}
#overlay{position:fixed;inset:0;background:rgba(5,6,10,.78);display:grid;place-items:center;z-index:9}
.card{width:min(720px,92vw);background:#1b1f2c;border:1px solid var(--line);border-radius:16px;padding:28px 32px}
.card h2{margin:0 0 10px;font-size:26px}.card p{color:#cdd3e1;line-height:1.8}
.card button{margin-top:14px;background:var(--acc);color:#111;border:0;border-radius:10px;padding:10px 22px;font-size:15px;font-weight:700;cursor:pointer}
.rep table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}.rep td{padding:6px 8px;border-bottom:1px solid var(--line)}.rep td:last-child{text-align:right;font-weight:700}
.rep .verdict{font-size:18px;font-weight:700;margin:6px 0}.score{display:flex;align-items:center;gap:18px;margin:8px 0 4px}.score .big{font-size:46px;font-weight:900;color:var(--acc)}.score .grade{font-size:22px;font-weight:800;padding:4px 14px;border-radius:10px;background:#0b0d12}
.turns td{vertical-align:top;font-size:13px}.turns td:last-child{text-align:left;font-weight:400}.alt{color:#9fd8b8;font-size:12px;margin-top:3px}
.fbbtn{background:#2b4a8b!important;color:#fff!important;margin-right:8px}.small{font-size:12px;color:var(--sub)}

@media (max-width:820px){
 header{padding:8px 12px}header h1{font-size:14px}header .sub{display:none}
 main{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}
 aside{display:flex;align-items:center;gap:10px;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}
 aside .who{margin:0}.bigav{display:none}.profile{display:none}
 .side{order:0;padding:6px 12px 8px;border-left:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
 .meter{margin:0}.meter .lbl{font-size:10.5px;flex-direction:column;gap:1px}.meter .lbl span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .bar{height:7px}.counts{display:none}
 #chat{order:1;min-height:0}
 #log{padding:10px 10px;gap:9px}.msg{max-width:84%;font-size:14px;padding:8px 11px}.mini{width:28px;height:28px}
 .tip{max-width:94%;font-size:12px}
 #choices{padding:8px 10px calc(8px + env(safe-area-inset-bottom));min-height:0;gap:6px}
 #choices button{font-size:13.5px;padding:9px 11px}
 footer{display:none}
 .card{padding:16px 16px;border-radius:12px}.card h2{font-size:19px}.card img.hero{height:150px}.rep img.hero{height:120px}
 .score .big{font-size:36px}.rep table{font-size:12.5px}
}
</style></head><body>
<header><div class="logo">禁</div><div><h1>禁煙外来 動機づけ面接シミュレーター</h1><div class="sub">返答を選ぶと、患者さんが声で答えます</div></div></header>
<main>
 <aside><div class="who"><img class="av" src="img/patient_neutral.webp" alt=""><div><b id="pname">ネコタ・タマさん</b><small>50代・営業職</small></div></div><img id="pav" class="bigav" src="img/patient_neutral.webp" alt="ネコタ・タマさん"><div class="profile" id="profile"></div></aside>
 <section id="chat"><div id="log"></div><div id="choices"></div></section>
 <section class="side">
  <div class="meter" id="m-change"><div class="lbl"><span>チェンジトーク（変わりたい気持ち）</span><span class="v"></span></div><div class="bar"><i></i></div></div>
  <div class="meter" id="m-rapport"><div class="lbl"><span>信頼関係</span><span class="v"></span></div><div class="bar"><i></i></div></div>
  <div class="meter" id="m-resistance"><div class="lbl"><span>抵抗（維持トーク）</span><span class="v"></span></div><div class="bar"><i></i></div></div>
  <div class="counts" id="counts"></div>
 </section>
</main>
<footer style="padding:6px 18px;font-size:11px;color:#7d869c;border-top:1px solid #2a3045;background:#11141b">教育用デモ。登場人物はすべて架空です。音声は Google Gemini TTS、イラストは Gemini 2.5 Flash Image で生成しました。指標は MITI 4.2.1 の考え方を簡略化したもので、実際の評価基準ではありません。 © 2026 Masahide Koda（東北大学 公衆衛生学分野）</footer>
<div id="overlay"><div class="card"><img class="hero" src="img/title.webp" alt=""><h2 id="t-title">禁煙外来 動機づけ面接シミュレーター</h2><p id="t-intro"></p><button id="startbtn">面接をはじめる</button><p class="small" style="margin-top:12px">音声が流れます。スピーカーまたはイヤホンをご用意ください。</p></div></div>
<script>
const Q=new URLSearchParams(location.search), DEMO=Q.get('demo'); // demo=good|poor|neutral → auto path
const CODE={OQ:'開かれた質問',CQ:'閉じた質問',SR:'単純な聞き返し',CR:'複雑な聞き返し',AF:'是認',SUM:'要約',AP:'自律性の尊重',GI:'情報提供',PER:'説得・警告',ADV:'許可のない助言',CON:'直面化'};
const GOOD=new Set(['OQ','SR','CR','AF','SUM','AP','GI']);
let S,m,cur,codes=[],path=[],hist=[],T0=performance.now();window.__clips=[];
const $=s=>document.querySelector(s), log=$('#log');
function setMeters(){for(const k of ['change','rapport','resistance']){m[k]=Math.max(0,Math.min(100,m[k]));$('#m-'+k+' i').style.width=m[k]+'%';$('#m-'+k+' .v').textContent=m[k]}
 const c=x=>codes.filter(y=>x.includes(y)).length;
 $('#counts').innerHTML=`質問 <b>${c(['OQ','CQ'])}</b>（うち開かれた <b>${c(['OQ'])}</b>）<br>聞き返し <b>${c(['SR','CR'])}</b>（うち複雑 <b>${c(['CR'])}</b>）<br>是認・要約・自律 <b>${c(['AF','SUM','AP'])}</b><br>説得・助言・直面化 <b>${c(['PER','ADV','CON'])}</b>`}
function mood(){const f=m.resistance>=60?"defensive":m.change>=45?"hopeful":m.change>=30?"thinking":"neutral";const im=$("#pav");if(!im.src.endsWith(f+".webp")){im.style.opacity=0;setTimeout(()=>{im.src="img/patient_"+f+".webp";im.style.opacity=1},250)}return f}
function add(cls,html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let AU=null;function unlockAudio(){if(AU)return;AU=new Audio();AU.playsInline=true;AU.src='data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//WreyTRUoAWgBgkOAGbZHBgG1OF6zM82DWbZaUmMBptgQhGjsyYqc9ae9XFz280948NMBWInljyzsNRFLPWdnZGWrddDsjK1unuSrVN9jJsK8KuQtQCtMBjCEtImISdNKJOopIpBFpNSMbIHCSRpRR5iakjTiyzLhchUUBwCgyKiweBv/7UsQbg8isVNoMPMjAAAA0gAAABEVFGmgqK////9bP/6XCykxBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq';AU.play().catch(()=>{})}
function play(src,label){return new Promise(res=>{unlockAudio();const a=AU;a.onended=null;a.onerror=null;a.src=src;window.__clips.push({src,t:(performance.now()-T0)/1000});
 const sp=add('speaking',`<span class="wave"><i></i><i></i><i></i><i></i><i></i></span>${label}`);
 a.onended=()=>{sp.remove();res()};a.onerror=()=>{sp.remove();setTimeout(res,1500)};a.play().catch(()=>{sp.remove();setTimeout(res,1500)})})}
async function patientSay(id){const n=S.nodes[id];await play(`audio/${id}.mp3`,'ネコタさんが話しています…');const r=add('row p',`<img class="mini" src="img/patient_${mood()}.webp"><div class="msg p">${n.patient}</div>`)}
async function showNode(id){cur=id;const n=S.nodes[id];await patientSay(id);
 if(n.end){return report(n.end)}
 const box=$('#choices');box.innerHTML='<div class="hint">返答を選んでください（タップ／クリック）</div>';
 n.choices.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c.label;b.onclick=()=>choose(i);box.appendChild(b)});
 if(DEMO){const pick=(S.demo&&S.demo[DEMO]||{})[id];await sleep(1600);const bs=box.querySelectorAll('button');const i=pick??0;bs[i].classList.add('hl');await sleep(1100);choose(i)}}
async function choose(i){const n=S.nodes[cur],c=n.choices[i];$('#choices').innerHTML='';
 add('row d',`<div class="msg d">${c.label}<span class="tag">${CODE[c.code]||c.code}</span></div><img class="mini" src="img/doctor.webp">`);codes.push(c.code);path.push(cur+':'+i);hist.push({node:cur,i});
 await play(`audio/${cur}_c${i}.mp3`,'あなた（医療者）');
 for(const k in c.delta)m[k]+=c.delta[k];setMeters();mood();
 add('tip '+(GOOD.has(c.code)?'good':'bad'),(GOOD.has(c.code)?'◎ ':'△ ')+c.feedback);
 await sleep(DEMO?1800:900);showNode(c.next)}
function report(end){const c=x=>codes.filter(y=>x.includes(y)).length;const R=c(['SR','CR']),Qn=c(['OQ','CQ']);
 const rq=Qn?(R/Qn).toFixed(2):'質問なし';const cr=R?Math.round(100*c(['CR'])/R)+'%':'聞き返しなし';
 const good=codes.filter(x=>GOOD.has(x)).length;
 const meter=(m.change+m.rapport+(100-m.resistance))/300;
 const score=Math.max(0,Math.min(100,Math.round(60*good/Math.max(1,codes.length)+40*meter)));
 const grade=score>=80?'A':score>=60?'B':'C';
 const sc=S.scoring||{};const txt=((sc.report_templates||{})[end]||'').split('\n').slice(2).join('<br>');
 const v={good:'行動変容への一歩を引き出せました',neutral:'関係は保てましたが、変化の言葉はまだ少なめです',poor:'患者さんが身構えてしまいました'}[end];
 const rows=hist.map((h,k)=>{const n=S.nodes[h.node],ch=n.choices[h.i],ok=GOOD.has(ch.code);let alt='';
   if(!ok){const best=n.choices.filter(x=>GOOD.has(x.code)).sort((a,b)=>(b.delta.change+b.delta.rapport-b.delta.resistance)-(a.delta.change+a.delta.rapport-a.delta.resistance))[0];
     if(best)alt=`<div class="alt">よりよい返答の例：「${best.label}」（${CODE[best.code]}）</div>`}
   return `<tr><td>${k+1}</td><td>${ok?'◎':'△'}</td><td>「${ch.label}」<br><span class="small">${CODE[ch.code]}：${ch.feedback}</span>${alt}</td></tr>`}).join('');
 $('#overlay').innerHTML=`<div class="card rep"><img class="hero" src="img/end_${end}.webp" alt=""><h2>パフォーマンス評価</h2><div class="verdict">${v}</div>
 <div class="score"><span class="big">${score}</span><span>/ 100点</span><span class="grade">評価 ${grade}</span></div>
 <p class="small">点数の内訳：MIに一致する返答の割合（60点）＋最後の面接の状態（チェンジトーク・信頼関係・抵抗の低さ、40点）</p>
 <table><tr><td>聞き返し ÷ 質問（R:Q）</td><td>${rq}</td></tr><tr><td>複雑な聞き返しの割合（%CR）</td><td>${cr}</td></tr>
 <tr><td>MIに一致する行動（是認・要約・自律の尊重）</td><td>${c(['AF','SUM','AP'])}</td></tr><tr><td>MIに一致しない行動（説得・助言・直面化）</td><td>${c(['PER','ADV','CON'])}</td></tr>
 <tr><td>チェンジトーク／信頼関係／抵抗</td><td>${m.change} / ${m.rapport} / ${m.resistance}</td></tr></table>
 <h3 style="margin:14px 0 4px;font-size:16px">返答ごとの振り返り</h3><table class="turns">${rows}</table>
 <h3 style="margin:14px 0 4px;font-size:16px">指導医からの講評</h3><p>${(S.feedback_voice||{})[end]||txt}</p>
 <p class="small">※指標はMITI 4.2.1の考え方を簡略化したデモです。実際の評価では、全発話をJevで分類し、教員が確率の低い発話を確認します。</p>
 <button class="fbbtn" onclick="AU.src='audio/feedback_${end}.mp3';AU.play()">講評をもう一度聞く</button><button onclick="location.href=location.pathname">もう一度</button></div>`;
 $('#overlay').style.display='grid';unlockAudio();const fa=AU;fa.onended=null;fa.src=`audio/feedback_${end}.mp3`;window.__clips.push({src:`audio/feedback_${end}.mp3`,t:(performance.now()-T0)/1000});fa.play().catch(()=>{});
 if(DEMO){let y=0;const card=$('.rep');const iv=setInterval(()=>{y+=3;card.scrollTop=y;if(y>card.scrollHeight)clearInterval(iv)},60)}}
fetch('scenario.json').then(r=>r.json()).then(j=>{S=j;m={...S.meters};$('#t-title').textContent=S.title||$('#t-title').textContent;$('#t-intro').textContent=S.intro||'';
 $('#pname').textContent=S.patient.name;$('#profile').textContent=S.patient.profile;setMeters();
 const go=()=>{$('#overlay').style.display='none';T0=performance.now();window.__t0=Date.now();showNode(S.start)};
 $('#startbtn').onclick=()=>{unlockAudio();go()};if(DEMO)setTimeout(go,2500)});
</script></body></html>
